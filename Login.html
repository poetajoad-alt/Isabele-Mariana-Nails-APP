<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style.css">
  <title>Login</title>
</head>

  <div class="login-page">
    <div class="login-container">
      <header class="login-header">
        <h1>Login</h1>
        <div class="menu-icon" aria-hidden="true">
          <span></span>
          <span></span>
          <span></span>
        </div>
      </header>

      <form id="loginForm" class="login-form" onsubmit="return handleLocalLogin(event)">
        <div class="form-group">
          <label class="field-label" for="nome">Nome</label>
          <input id="nome" name="nome" type="text" class="input-field" value="Maria Clara" required>
        </div>

        <div class="form-group">
          <label class="field-label" for="senha">Senha</label>
          <input id="senha" name="senha" type="password" class="input-field" value="1234" required>
        </div>

        <button type="submit" class="btn btn-login">Login</button>
      </form>

      <button type="button" class="btn btn-google" onclick="handleGoogleLogin()">
        <span class="google-icon" aria-hidden="true">
          <svg width="18" height="18" viewBox="0 0 18 18" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M17.64 9.20454C17.64 8.56636 17.5782 7.95545 17.4627 7.37273H9V10.82H13.8436C13.6764 11.9255 13.0773 12.8445 12.1336 13.4473V15.5627H14.8682C16.63 13.9991 17.64 11.8 17.64 9.20454Z" fill="#4285F4" />
            <path d="M9 18C11.43 18 13.4327 17.1418 14.8682 15.5627L12.1336 13.4473C11.3218 14.0118 10.2527 14.3227 9 14.3227C6.66545 14.3227 4.71636 12.7764 4.17636 10.6027H1.34273V12.7973C2.77727 15.9818 5.71636 18 9 18Z" fill="#34A853" />
            <path d="M4.17636 10.6027C4.04545 10.1027 3.96 9.57273 3.96 9.02273C3.96 8.47273 4.04545 7.94273 4.17636 7.44273V5.24727H1.34273C0.617273 6.72727 0.18 8.32727 0.18 9.99727C0.18 11.6673 0.617273 13.2673 1.34273 14.7473L4.17636 10.6027Z" fill="#FBBC05" />
            <path d="M9 3.67727C10.3655 3.67727 11.5782 4.17273 12.4991 5.08273L15.0064 2.57545C13.4264 0.981818 11.43 0 9 0C5.71636 0 2.77727 2.01818 1.34273 5.20273L4.17636 7.44273C4.71636 5.26909 6.66545 3.67727 9 3.67727Z" fill="#EA4335" />
          </svg>
        </span>
        Login com o Google
      </button>

      <p class="login-footer">Não tem conta? <a href="registro.html" class="login-link">Registre-se aqui</a></p>
    </div>
  </div>

  <script src="auth.js"></script>
  <script src="https://accounts.google.com/gsi/client" async defer onload="initializeGoogleSignIn()"></script>
</body>

</html>
