<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style.css">
  <title>Seleção de Serviço</title>
</head>

<body>
  <div class="principal-page">
    <div class="principal-card">
      <div class="hero-row">
        <div class="hero-copy">
          <p class="hero-title">Seja Bem-Vinda</p>
          <p class="hero-subtitle">Isabele!</p>
        </div>
        <div class="hero-avatar">
          <img src="assets/image 1.png" alt="Isabele" />
        </div>
      </div>

      <div class="search-card">
        <div class="search-wrapper">
          <input type="search" class="search-input" placeholder="Search">
          <span class="search-icon" aria-hidden="true">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
              <path d="M15.5 14H14.71L14.43 13.73C15.41 12.59 16 11.11 16 9.5C16 5.91 13.09 3 9.5 3C5.91 3 3 5.91 3 9.5C3 13.09 5.91 16 9.5 16C11.11 16 12.59 15.41 13.73 14.43L14 14.71V15.5L19 20.49L20.49 19L15.5 14ZM9.5 14C7.01 14 5 11.99 5 9.5C5 7.01 7.01 5 9.5 5C11.99 5 14 7.01 14 9.5C14 11.99 11.99 14 9.5 14Z" fill="#934761"/>
            </svg>
          </span>
        </div>
      </div>

      <div class="white-panel">
        <div class="service-list">
          <button class="service-item">
            <div class="service-thumb">
              <img src="assets/image 3.png" alt="Nail Designer" />
            </div>
            <span class="service-label">Nail Designer</span>
          </button>

          <button class="service-item">
            <div class="service-thumb">
              <img src="assets/image 3.png" alt="Manicure e Pedicure" />
            </div>
            <span class="service-label">Manicure e Pedicure</span>
          </button>

          <button class="service-item">
            <div class="service-thumb">
              <img src="assets/image 3.png" alt="Esmaltação em Gel" />
            </div>
            <span class="service-label">Esmaltação em Gel</span>
          </button>

          <button class="service-item">
            <div class="service-thumb">
              <img src="assets/image 3.png" alt="Spa dos Pés" />
            </div>
            <span class="service-label">Spa dos Pés</span>
          </button>

          <button class="service-item">
            <div class="service-thumb">
              <img src="assets/image 3.png" alt="Cursos e Mais" />
            </div>
            <span class="service-label">Cursos e Mais</span>
          </button>
        </div>
      </div>
    </div>
  </div>
</body>

</html>
