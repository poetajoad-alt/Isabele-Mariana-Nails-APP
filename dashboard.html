<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style.css">
  <title>Dashboard - Aplicativo Isabele Mariana</title>
</head>

<body>
  <div class="container">
    <div class="dashboard-header">
      <div class="logo-section">
        <img src="assets/image 1.png" alt="IM Isabele Mariana Nails Design" class="logo-image">
      </div>
      
      <button class="btn-logout" onclick="handleLogout()">Sair</button>
    </div>

    <div class="dashboard-content">
      <h1 id="user-greeting">Bem-vindo!</h1>
      
      <div class="dashboard-info">
        <div class="user-info">
          <h2>Informações da Conta</h2>
          <p><strong>Nome:</strong> <span id="user-name">-</span></p>
          <p><strong>Email:</strong> <span id="user-email">-</span></p>
          <p><strong>Foto:</strong></p>
          <img id="user-picture" src="" alt="Foto de perfil" class="user-picture">
        </div>

        <div class="booking-section">
          <h2>Agendar Serviço</h2>
          <p>Funcionalidade de agendamento virá em breve!</p>
          <button class="btn btn-login" disabled>Agendar Agora</button>
        </div>
      </div>
    </div>
  </div>

  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <script src="auth.js"></script>
  <script>
    // Carregar dados do usuário
    document.addEventListener('DOMContentLoaded', function() {
      const userData = checkAuth();
      
      if (!userData) {
        // Redirecionar para login se não autenticado
        window.location.href = 'Login.html';
        return;
      }
      
      // Preencher informações do usuário
      document.getElementById('user-greeting').textContent = `Bem-vindo, ${userData.given_name}!`;
      document.getElementById('user-name').textContent = userData.name;
      document.getElementById('user-email').textContent = userData.email;
      
      if (userData.picture) {
        document.getElementById('user-picture').src = userData.picture;
      }
    });
  </script>
</body>

</html>
